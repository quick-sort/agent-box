[project]
name = "agent-box"
version = "0.1.4"
description = "IM → Router → Agent pipeline for managing coding projects via chat"
requires-python = ">=3.12"
dependencies = [
    # Slash-command (/clear) behaviour in SDK mode must be re-verified on each
    # bump. Verified on 0.2.180 (bundled CLI 2.1.321): "/clear" is treated as
    # a built-in command (emits ConversationResetMessage + a fresh session id)
    # and "/compact" still works. Older 0.2.132+ builds leaked "/clear" to the
    # model as plain text, which is why this stayed pinned at 0.2.87.
    "claude-agent-sdk==0.2.180",
    "anthropic>=0.40",
    "anyio>=4.0",
    "pycryptodome>=3.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt-toolkit>=3.0.52",
    "textual>=3.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "wecom-aibot-sdk>=1.0.8",
    "agent-client-protocol==0.12.1",
]

[project.scripts]
agent-box = "agent_box.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_box"]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-anyio>=0.0.0",
]

[tool.uv]

[tool.pytest.ini_options]
testpaths = ["tests"]
